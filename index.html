<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive JavaScript Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Interactive JavaScript Elements</h1>

    <!-- Button with click and hover effects -->
    <button id="interactive-button">Click Me!</button>

    <!-- Image gallery -->
    <div class="gallery">
        <img src="pexels-photo-2740954.webp" alt="Image">
    </div>

    <!-- Tabs for content -->
    <div class="tabs">
        <button class="tab-btn" data-tab="1">About</button>
        <button class="tab-btn" data-tab="2">Background</button>
        <div class="tab-content" id="tab-1">Web Developer in the making</div>
        <div class="tab-content" id="tab-2">Three months in PLP</div>
    </div>

    <!-- Form for validation -->
    <form id="user-form">
        <input type="text" id="username" placeholder="Enter username" required>
        <input type="email" id="email" placeholder="Enter email" required>
        <input type="password" id="password" placeholder="Enter password" required>
        <button type="submit">Submit</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
